<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forge tickets — Engineering Workbench</title>
  <link rel="stylesheet" href="/ui.css">
  <script src="/vendor/mermaid.min.js" defer></script>
  <script src="/ui.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <button id="home-btn" class="anvil-mark" type="button" title="All tickets">🔥</button>
      <div class="crumbs-title">
        <p class="eyebrow">FORGE // READ-ONLY WORKBENCH</p>
        <div class="title-crumbs">
          <h1 id="page-title">Ticket dashboard</h1>
        </div>
      </div>
    </div>
    <div class="topbar-meta">
      <div class="wiki-pill" title="Repository wiki path">
        <span class="wiki-label">WIKI</span>
        <code id="wiki">Loading...</code>
      </div>
      <div class="status-group">
        <span class="live-dot" aria-hidden="true"></span>
        <p id="status" role="status" aria-live="polite">Loading tickets...</p>
      </div>
      <button id="refresh" class="btn-ember" type="button">↻ Refresh</button>
    </div>
  </header>

  <main class="workbench-shell">
    <section id="errors" class="errors-banner" role="alert" hidden>
      <h2>⚠️ Read errors</h2>
      <ul></ul>
    </section>

    <!-- VIEW 1: Clean Ticket Grid Overview -->
    <div id="overview-screen" class="overview-screen">
      <section id="kpis" class="kpi-strip" aria-label="Ticket metrics">
        <div class="kpi-card" data-tone="ember">
          <span class="kpi-label">🎫 Active</span>
          <strong id="kpi-total" class="kpi-value">0</strong>
        </div>
        <div class="kpi-card" data-tone="warn">
          <span class="kpi-label">🟡 Your move</span>
          <strong id="kpi-needs-me" class="kpi-value">0</strong>
        </div>
        <div class="kpi-card" data-tone="info">
          <span class="kpi-label">🚦 In review</span>
          <strong id="kpi-in-review" class="kpi-value">0</strong>
        </div>
        <div class="kpi-card" data-tone="ok">
          <span class="kpi-label">🟢 Approved gates</span>
          <strong id="kpi-approved" class="kpi-value">0</strong>
        </div>
      </section>

      <div class="filters" role="search" aria-label="Filter tickets">
        <label class="search-field">
          <span class="field-label">Find a ticket</span>
          <input id="search" type="search" placeholder="Filter by key, title, or next step...">
        </label>
        <div class="state-pills" id="state-pills" role="group" aria-label="Quick state filter"></div>
        <label class="state-select-label">
          <span class="field-label">State</span>
          <select id="state"><option value="">All states</option></select>
        </label>
        <label class="checkbox">
          <input id="done" type="checkbox">
          <span>Include done tickets</span>
        </label>
      </div>

      <p id="empty" class="empty-banner" hidden></p>

      <div id="board" class="ticket-grid" aria-label="Tickets by state"></div>
    </div>

    <!-- VIEW 2: Focused Ticket Cockpit (Drill-down) -->
    <section id="cockpit" class="cockpit-screen" aria-label="Ticket cockpit" hidden>
      <div id="cockpit-header" class="cockpit-header"></div>
      <nav id="cockpit-nav" class="cockpit-nav" aria-label="Ticket sections"></nav>
      <div id="cockpit-body" class="cockpit-body"></div>
    </section>
  </main>
</body>
</html>
